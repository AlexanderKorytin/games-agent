[project]
name = "games-agent"
version = "0.1.0"
description = "Личный игровой агент: подбирает игры Steam по вкусу человека"
requires-python = ">=3.11"
dependencies = [
    # Агент собран из библиотеки myharness как есть: Agent, карточка папки, инварианты.
    "myharness",
    # Магазин Steam: типы `Метка` и `Игра` и запросы к витрине.
    "steam-mcp",
    # Веб-приложение агента: страница с подборкой и кнопками оценки.
    "starlette>=0.40",
    "uvicorn>=0.30",
    # Векторы RAG (`similar.py`).
    "numpy>=2,<3",
    # Значок в строке меню (`menubar.py`): NSStatusItem из AppKit.
    "pyobjc-framework-Cocoa>=11",
]

[tool.uv.sources]
# Пути — те же, что у `agents/digest`: агент лежит в репозитории рядом с библиотекой и сервером.
# `myharness` — библиотека из репозитория челленджа AI SDLC, ветка `main`. Точную фиксацию держит
# `uv.lock`: правка `myharness` в челлендже сама агента не меняет. Взять новую версию —
# `uv lock --upgrade-package myharness`, затем проверки.
myharness = { git = "https://github.com/AlexanderKorytin/ai-challenge-2026", subdirectory = "myharness", branch = "main" }
steam-mcp = { path = "../../mcp_servers/steam", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
